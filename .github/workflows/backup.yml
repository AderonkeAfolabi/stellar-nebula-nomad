name: Automated Backup

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: "0 2 * * *"

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      network:
        description: "Network (testnet/mainnet)"
        required: true
        default: "testnet"
        type: choice
        options:
          - testnet
          - mainnet

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create backup directory
        run: mkdir -p backups

      - name: Run backup script (Horizon snapshots)
        env:
          CONTRACT_ID: ${{ secrets.CONTRACT_ID }}
          STELLAR_NETWORK: ${{ github.event.inputs.network || 'testnet' }}
          RPC_URL: ${{ secrets.RPC_URL }}
          HORIZON_URL: ${{ secrets.HORIZON_URL }}
          RETENTION_DAYS: 30
        run: |
          chmod +x scripts/backup.sh
          ./scripts/backup.sh

      - name: Upload backup to S3
        # GitHub Actions does not allow `secrets.*` in step-level `if:`
        # expressions. Gate in the shell instead so this step actually runs
        # when credentials are configured.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
          S3_BUCKET: ${{ secrets.S3_BACKUP_BUCKET }}
        run: |
          if [ -z "${S3_BUCKET:-}" ] || [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "S3 backup not configured (S3_BUCKET / AWS credentials missing); skipping."
            exit 0
          fi
          aws s3 cp backups/*.tar.gz "s3://$S3_BUCKET/backups/" --recursive

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_number }}
          path: backups/*.tar.gz
          retention-days: 30

      - name: Verify backup integrity
        run: |
          chmod +x scripts/restore.sh
          LATEST_BACKUP=$(ls -t backups/*.tar.gz | head -n 1)
          ./scripts/restore.sh --backup "$LATEST_BACKUP" --verify-only

      - name: Send success notification
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              text: "✅ Backup completed successfully",
              attachments: [{
                color: 'good',
                text: `Backup completed for ${process.env.AS_WORKFLOW}\nRun: ${process.env.AS_RUN_NUMBER}`
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Send failure notification
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              text: "❌ Backup failed",
              attachments: [{
                color: 'danger',
                text: `Backup failed for ${process.env.AS_WORKFLOW}\nRun: ${process.env.AS_RUN_NUMBER}`
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

  monthly-drill:
    runs-on: ubuntu-latest
    needs: backup
    if: github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The schedule fires daily; only the first Monday of the month is the
      # monthly drill. Compute the gate in the shell rather than relying on an
      # `if:` expression that GitHub Actions cannot evaluate for dates.
      - name: First-Monday gate
        id: gate
        run: |
          if [ "$(date -u +%u)" = "1" ] && [ "$(date -u +%d)" -le 7 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download latest backup
        if: steps.gate.outputs.run == 'true'
        uses: actions/download-artifact@v4
        with:
          name: backup-${{ github.run_number }}
          path: backups/

      - name: Run disaster recovery drill
        id: drill
        if: steps.gate.outputs.run == 'true'
        run: |
          chmod +x scripts/restore.sh
          LATEST_BACKUP=$(ls -t backups/*.tar.gz | head -n 1)
          ./scripts/restore.sh \
            --backup "$LATEST_BACKUP" \
            --network testnet \
            --dry-run

      - name: Generate drill report
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          echo "# Disaster Recovery Drill Report" > drill-report.md
          echo "Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> drill-report.md
          echo "Status: ${{ steps.drill.outcome }}" >> drill-report.md
          echo "Recovery Time target: < 1 hour (measured\: see restore report)" >> drill-report.md
          echo "Note: dry-run only; full Scenario 4 requires a quarterly manual drill." >> drill-report.md

      - name: Upload drill report
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: drill-report-${{ github.run_number }}
          path: drill-report.md
